name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: fereshtehazizi
          outputs: |
              dist/github-contribution-grid-snake.svg?color_snake=#A855F7&color_dots=#161B22,#2D1B69,#5B21B6,#7C3AED,#A855F7
              dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#A855F7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
